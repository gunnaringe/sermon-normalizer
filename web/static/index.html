<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sermon Studio</title>
  <link rel="icon" href="icons/logo.svg" type="image/svg+xml">
  <link rel="icon" href="icons/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <!-- with credentials: the studio is behind a login -->
  <link rel="manifest" href="manifest.webmanifest" crossorigin="use-credentials">
  <link rel="stylesheet" href="style.css">
  <script src="theme.js"></script>
  <script type="module" src="app.js"></script>
</head>
<body>
  <header>
    <a class="brand" href="#/"><img src="icons/logo.svg" alt="" width="28" height="28"><span class="brand-name">Sermon Studio</span></a>
    <select id="church" title="Church" aria-label="Church" data-i18n-title="Church" data-i18n-aria-label="Church"></select>
    <span id="church-name" class="church-name" hidden></span>
    <div class="tools">
      <a href="#/shares" data-nav="shares" class="icon shares-icon" title="Shares" aria-label="Shares" data-i18n-title="Shares" data-i18n-aria-label="Shares" hidden>
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        <span class="count" hidden></span>
      </a>
      <a href="#/settings" data-nav="settings" class="icon" title="Settings" aria-label="Settings" data-i18n-title="Settings" data-i18n-aria-label="Settings">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </a>
      <form id="logout" method="post" hidden>
        <button type="button" class="icon" title="Log out" aria-label="Log out" data-i18n-title="Log out" data-i18n-aria-label="Log out">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          <span class="ask" data-i18n="Log out?">Log out?</span>
        </button>
      </form>
    </div>
  </header>
  <main id="view"><p class="muted" data-i18n="Loading…">Loading…</p></main>
  <footer><a href="https://github.com/gunnaringe/sermon-studio" target="_blank" rel="noopener" data-i18n="Source code on GitHub">Source code on GitHub</a></footer>
</body>
</html>
