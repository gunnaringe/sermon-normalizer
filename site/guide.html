<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-t="guide.title">Sermon Studio</title>
  <meta name="description" data-t-content="guide.description" content="">
  <meta name="theme-color" content="#047857">
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="icon" href="img/favicon-32.png" sizes="32x32">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css">
  <script src="site.js"></script>

<body>
  <header>
    <div class="bar">
      <a class="brand" href="./" data-t-aria-label="nav.home"><img src="img/logo.svg" alt="" width="30" height="30"><span>Sermon Studio</span></a>
      <nav>
        <a href="./#how" data-t="nav.how"></a>
        <a href="./#churches" data-t="nav.churches"></a>
        <a href="./#download" data-t="nav.download"></a>
        <a href="guide.html" aria-current="page" data-t="nav.guide"></a>
        <a href="privacy.html" data-t="nav.privacy"></a>
      </nav>
      <div class="tools">
        <select id="lang" data-t-aria-label="lang.label"></select>
        <a id="login" class="button primary" hidden data-t="nav.login"></a>
      </div>
    </div>
  </header>
  <main class="doc">

    <section>
      <h1 data-t="guide.h1"></h1>
      <p class="lede" data-t="guide.lede"></p>

      <h2 data-t="guide.recordings.h2"></h2>
      <p data-t="guide.recordings.p"></p>
      <figure><img class="shot" data-shot="recordings" data-t-alt="guide.recordings.alt" alt="" width="1280" height="800" loading="lazy"></figure>

    <section id="upload">
      <h2 data-t="guide.upload.h2"></h2>

      <figure><img class="shot" data-shot="upload" data-t-alt="guide.upload.alt" alt="" loading="lazy"></figure>

      <p data-t="guide.edit.p1"></p>

      <p data-t="guide.save.p"></p>
      <figure><img class="shot" data-shot="making" data-t-alt="guide.save.alt" alt="" width="1280" height="800" loading="lazy"></figure>

      <p data-t="guide.files.p"></p>
      <figure><img class="shot" data-shot="files" data-t-alt="guide.files.alt" alt="" width="1280" height="800" loading="lazy"></figure>

      <h2 data-t="guide.share.h2"></h2>
      <p data-t="guide.share.p1"></p>
      <figure><img class="shot" data-shot="share" data-t-alt="guide.share.alt" alt="" width="1280" height="800" loading="lazy"></figure>

      <h2 data-t="guide.more.h2"></h2>
      <p data-t="guide.more.p"></p>
