# The desktop app's release: on a v* tag, the program for every system with our ffmpeg built in, packaged
# (Windows .exe, Sermon Studio.app for each Mac, Linux tar.gz with a .desktop file), published as a GitHub
# release, after each program passed the end-to-end test on its own system (verify). On a pull request that
# changes the packaging or the desktop program, and when started by hand, the same is built and verified, not
# published.
name: Release

on:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]
    paths: [packaging/**, cmd/sermon-studio-desktop/**, scripts/build-desktop.sh, scripts/fetch-ffmpeg.sh, scripts/package-desktop.sh, .github/workflows/release.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
      - id: version
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then v=${GITHUB_REF_NAME#v}; else v=0.0.0; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
      - name: The Windows program's icon and details
        run: |
          v=${{ steps.version.outputs.version }}
          go run github.com/tc-hib/go-winres@v0.3.3 simply --arch amd64 --icon web/static/icons/icon-512.png \
            --manifest gui --product-name "Sermon Studio" --file-description "Sermon Studio" \
            --product-version "$v" --file-version "$v" --out cmd/sermon-studio-desktop/rsrc
      - run: scripts/build-desktop.sh "${{ steps.version.outputs.version }}"
      - run: scripts/package-desktop.sh linux "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-windows
          path: dist/release/
      - uses: actions/upload-artifact@v4
        with:
          name: programs
          path: dist/sermon-studio-desktop-*

  macos:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: programs
          path: dist
      - run: scripts/package-desktop.sh macos "${{ needs.build.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/release/

  # The programs as released, each on its own system: the end-to-end test (cmd/sermon-studio-desktop) starts it,
  # uploads a recording, makes a sermon with the ffmpeg built in, and sees it stop by itself.
  verify:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: windows-amd64, os: windows-latest, ext: .exe }
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-amd64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: programs
          path: dist
      - run: chmod +x dist/* && go test -count=1 -v -run EndToEnd ./cmd/sermon-studio-desktop/
        env:
          DESKTOP_BIN: ${{ github.workspace }}/dist/sermon-studio-desktop-${{ matrix.target }}${{ matrix.ext }}
          DESKTOP_EMBEDDED: 1

  publish:
    needs: [build, macos, verify]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist/release
          merge-multiple: true
      - run: |
          v=${{ needs.build.outputs.version }}
          (cd dist/release && sha256sum * > SHA256SUMS)
          . packaging/ffmpeg-release
          sed -e "s/{version}/$v/g" -e "s/{ffmpeg}/$FFMPEG_RELEASE/g" packaging/release-notes.md > notes.md
          gh release create "$GITHUB_REF_NAME" dist/release/* --verify-tag --title "Sermon Studio $v" --notes-file notes.md
