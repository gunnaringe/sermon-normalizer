# Our own small LGPL ffmpeg for the desktop app (ffmpeg/build.sh), for every system it runs on. Each build is
# checked (ffmpeg/check.sh) and all Go tests run against it on that system. On main, and when started by hand,
# the builds are published as the release named in ffmpeg/versions (RELEASE), once: change RELEASE for new ones.
name: ffmpeg

on:
  push:
    branches: [main]
    paths: [ffmpeg/**, .github/workflows/ffmpeg.yml]
  pull_request:
    branches: [main]
    paths: [ffmpeg/**, .github/workflows/ffmpeg.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: windows-amd64, os: ubuntu-24.04 }
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-amd64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Build (Linux, static in Alpine)
        if: startsWith(matrix.target, 'linux-')
        run: |
          docker run --rm -v "$PWD/ffmpeg:/f" -w /f alpine:3.22 sh -c \
            'apk add -q --no-cache build-base nasm pkgconf curl xz perl coreutils && ./build.sh ${{ matrix.target }} && chmod -R a+rwX out'
      - name: Build (Windows, mingw-w64)
        if: matrix.target == 'windows-amd64'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq mingw-w64 nasm pkgconf >/dev/null
          ffmpeg/build.sh windows-amd64
      - name: Build (macOS)
        if: startsWith(matrix.target, 'darwin-')
        run: |
          brew install nasm pkgconf
          ffmpeg/build.sh ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ffmpeg/out/ff*-${{ matrix.target }}*
          if-no-files-found: error
      - if: matrix.target == 'linux-amd64'
        uses: actions/upload-artifact@v4
        with:
          name: sources
          path: ffmpeg/out/sources/
          if-no-files-found: error

  test:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: linux-amd64, os: ubuntu-24.04 }
          - { target: linux-arm64, os: ubuntu-24.04-arm }
          - { target: windows-amd64, os: windows-latest }
          - { target: darwin-arm64, os: macos-15 }
          - { target: darwin-amd64, os: macos-15-intel }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.x' # as the image build (golang:1.25)
      - uses: actions/download-artifact@v4
        with:
          name: ffmpeg-${{ matrix.target }}
          path: ff
      - name: ffmpeg and ffprobe in PATH
        run: |
          cd ff
          ext=; [ "${{ matrix.target }}" = windows-amd64 ] && ext=.exe
          mv "ffmpeg-${{ matrix.target }}$ext" "ffmpeg$ext" && mv "ffprobe-${{ matrix.target }}$ext" "ffprobe$ext"
          chmod +x ff*
          # On Windows as a Windows path: Go does not know bash's /d/a/...
          if command -v cygpath >/dev/null; then cygpath -w "$PWD"; else echo "$PWD"; fi >> "$GITHUB_PATH"
      - run: ffmpeg -hide_banner -version | head -1 && ffmpeg/check.sh "$(command -v ffmpeg)"
      - run: go test ./...
        env:
          FFMPEG_REQUIRED: 1 # fail, not skip, when ffmpeg is not found

  release:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish, unless it is there already
        run: |
          . ffmpeg/versions
          if gh release view "$RELEASE" >/dev/null 2>&1; then echo "$RELEASE is published already"; exit 0; fi
          mkdir dist
          cp artifacts/ffmpeg-*/ffmpeg-* dist/
          cp artifacts/sources/* dist/
          # The licences, from the sources.
          mkdir lic && for f in dist/*.tar.*; do tar -xf "$f" -C lic; done
          { for pair in "ffmpeg-$FFMPEG_VERSION/COPYING.LGPLv2.1:ffmpeg $FFMPEG_VERSION (LGPL 2.1 or later)" \
              "lame-$LAME_VERSION/COPYING:LAME $LAME_VERSION (LGPL 2 or later)" \
              "opus-$OPUS_VERSION/COPYING:Opus $OPUS_VERSION (BSD)" "zlib-$ZLIB_VERSION/LICENSE:zlib $ZLIB_VERSION"; do
              printf '==== %s ====\n\n' "${pair#*:}"; cat "lic/${pair%%:*}"; printf '\n\n'; done; } > dist/LICENSES.txt
          (cd dist && sha256sum * > SHA256SUMS)
          cat > notes.md <<NOTES
          ffmpeg $FFMPEG_VERSION for the Sermon Studio desktop app, built by [ffmpeg/build.sh](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/ffmpeg/build.sh) at ${{ github.sha }}: LGPL (no GPL or nonfree parts), static, with LAME $LAME_VERSION, Opus $OPUS_VERSION and zlib $ZLIB_VERSION. Every build passed ffmpeg/check.sh and all Go tests on its own system.

          The exact sources are attached, and the licences in LICENSES.txt.
          NOTES
          gh release create "$RELEASE" dist/* --title "$RELEASE" --notes-file notes.md --latest=false --target "${{ github.sha }}"
