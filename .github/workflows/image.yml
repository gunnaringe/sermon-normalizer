# Builds the image (go vet + all tests with ffmpeg run inside the build) and
# publishes it. Every main build gets a sortable main-<YYYYMMDDHHmmss UTC>-<sha>
# tag, which Flux image automation in gunnaringe/clusters (kate) rolls out.
name: Image

on:
  push:
    branches: [main]
    tags: ['v*'] # a release: the image gets the version too
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # arm64's final stage (apk add ffmpeg and its check) runs emulated; the Go build is cross-compiled
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/gunnaringe/sermon-studio
          tags: |
            type=ref,event=pr
            type=sha
            type=raw,value=main-{{date 'YYYYMMDDHHmmss' tz='UTC'}}-{{sha}},enable={{is_default_branch}}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
